name: AI PR Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        run: |
          NUM="${{ github.event.pull_request.number }}"
          if [ -z "$NUM" ]; then
            NUM="${{ inputs.pr_number }}"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch PR diff (source files only)
        run: |
          # 설정/문서 파일 제외 — Gemini가 소스 코드만 리뷰하도록
          gh pr diff "${{ steps.pr.outputs.number }}" \
            -- ':!*.yml' ':!*.yaml' ':!*.md' ':!*.lock' \
               ':!*.json' ':!*.toml' ':!*.txt' ':!*.env*' \
            > /tmp/pr_diff.txt || true

          # 소스 파일이 없으면 전체 diff로 폴백
          if [ ! -s /tmp/pr_diff.txt ]; then
            gh pr diff "${{ steps.pr.outputs.number }}" > /tmp/pr_diff.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini review
        id: review
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          diff = open('/tmp/pr_diff.txt').read()[:20000]
          agents_md = open('AGENTS.md').read() if os.path.exists('AGENTS.md') else ''

          standards = agents_md if agents_md else '- 정확성, 보안 취약점, 코드 품질 확인'

          prompt = '\n'.join([
            '# 역할',
            '당신은 시니어 소프트웨어 엔지니어입니다.',
            '한국어로 답변하세요. 기술 용어(함수명, 변수명, 에러명 등)는 영어 그대로 사용해도 됩니다.',
            '',
            '# 리뷰 기준',
            standards,
            '',
            '# PR Diff',
            diff,
            '',
            '# 출력 형식 (반드시 아래 형식 그대로 작성)',
            '',
            '## 요약',
            '변경 사항을 2-3문장으로 설명하세요.',
            '',
            '## 이슈',
            '각 이슈를 아래 형식으로 작성하세요:',
            '- 🔴 치명적: [설명] (치명적 문제가 없으면 이 줄 생략)',
            '- 🟡 제안: [설명] (제안이 없으면 이 줄 생략)',
            '- ✅ 이슈 없음 (이슈가 없을 때만)',
            '',
            '## 판정',
            '아래 중 하나만 단독으로 작성하세요:',
            'APPROVE',
            '',
            '규칙: 🔴 치명적 이슈가 하나라도 있으면 REQUEST_CHANGES, 없으면 APPROVE',
            '## 판정 섹션의 마지막 줄은 반드시 APPROVE 또는 REQUEST_CHANGES 단어만 있어야 합니다.',
          ])

          payload = {
            'contents': [{'parts': [{'text': prompt}]}],
            'generationConfig': {'maxOutputTokens': 4000, 'temperature': 0.1},
          }

          api_key = os.environ['GEMINI_API_KEY']
          models = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-2.0-flash-exp']

          import time
          data = None
          for model in models:
            url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}'
            req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
            )
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req, timeout=90) as resp:
                  data = json.loads(resp.read())
                  print(f'Using model: {model} (attempt {attempt+1})')
                  break
              except urllib.error.HTTPError as e:
                body = e.read().decode()
                code = e.code
                print(f'{model} attempt {attempt+1} failed ({code}): {body[:200]}', file=sys.stderr)
                if code == 503 and attempt < 2:
                  wait = 15 * (attempt + 1)
                  print(f'  Retrying in {wait}s...', file=sys.stderr)
                  time.sleep(wait)
                else:
                  break
              except Exception as e:
                print(f'{model} error: {e}', file=sys.stderr)
                break
            if data:
              break

          if data is None:
            print('All models failed.', file=sys.stderr)
            sys.exit(1)

          review = data['candidates'][0]['content']['parts'][0]['text']
          open('/tmp/review.txt', 'w').write(review)

          verdict = 'REQUEST_CHANGES'
          for line in reversed(review.splitlines()):
            line = line.strip()
            if line == 'APPROVE':
              verdict = 'APPROVE'
              break
            if line == 'REQUEST_CHANGES':
              break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'verdict={verdict}\n')

          print(f'Verdict: {verdict}')
          PYEOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post review comment
        run: |
          VERDICT="${{ steps.review.outputs.verdict }}"
          PR_NUM="${{ steps.pr.outputs.number }}"

          if [ "$VERDICT" = "APPROVE" ]; then
            BADGE="![승인됨](https://img.shields.io/badge/Gemini-승인됨-brightgreen)"
          else
            BADGE="![수정 요청](https://img.shields.io/badge/Gemini-수정_요청-red)"
          fi

          {
            echo "## 🤖 Gemini 코드 리뷰 — $BADGE"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "<!-- gemini-verdict: $VERDICT -->"
            echo ""
            echo "---"
            echo "*Gemini AI 자동 리뷰*"
          } > /tmp/comment.md

          gh pr comment "$PR_NUM" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Auto-merge if approved
        if: steps.review.outputs.verdict == 'APPROVE'
        run: |
          echo "Gemini 승인 — PR #${{ steps.pr.outputs.number }} 자동 merge"
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log to Google Sheets
        if: always()
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, datetime

          sheet_id = os.environ.get('GOOGLE_SHEET_ID', '')
          sa_json = os.environ.get('GOOGLE_SA_JSON', '').strip()
          if not sheet_id or not sa_json:
            print('GOOGLE_SHEET_ID or GOOGLE_SA_JSON not set — skipping log')
            exit(0)
          try:
            sa = json.loads(sa_json)
          except json.JSONDecodeError as e:
            print(f'SA JSON parse error: {e}')
            print(f'  First 50 chars: {repr(sa_json[:50])}')
            print('  Hint: Secret이 올바른 JSON인지 확인하세요 (GitHub Settings → Secrets → GOOGLE_SA_JSON)')
            exit(1)

          # JWT 생성 (서비스 계정 인증)
          import base64, time, hashlib
          from urllib.parse import urlencode

          def b64url(data):
            if isinstance(data, str): data = data.encode()
            return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          header = b64url(json.dumps({'alg': 'RS256', 'typ': 'JWT'}))
          now = int(time.time())
          claim = b64url(json.dumps({
            'iss': sa['client_email'],
            'scope': 'https://www.googleapis.com/auth/spreadsheets',
            'aud': 'https://oauth2.googleapis.com/token',
            'exp': now + 3600,
            'iat': now,
          }))

          import subprocess, tempfile, os as _os
          key_pem = sa['private_key'].encode()
          msg = f'{header}.{claim}'.encode()
          with tempfile.NamedTemporaryFile(delete=False, suffix='.pem') as f:
            f.write(key_pem); key_path = f.name
          with tempfile.NamedTemporaryFile(delete=False) as f:
            f.write(msg); msg_path = f.name
          sig_bytes = subprocess.check_output(['openssl', 'dgst', '-sha256', '-sign', key_path, msg_path])
          _os.unlink(key_path); _os.unlink(msg_path)
          sig = b64url(sig_bytes)
          jwt = f'{header}.{claim}.{sig}'

          # Access token 발급
          token_resp = urllib.request.urlopen(
            urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=urlencode({'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer', 'assertion': jwt}).encode(),
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
            )
          )
          access_token = json.loads(token_resp.read())['access_token']

          # 로그 데이터
          review = open('/tmp/review.txt').read() if _os.path.exists('/tmp/review.txt') else ''
          summary = ''
          issues_count = 0
          for line in review.splitlines():
            if line.startswith('## 요약') or line.startswith('## Summary'):
              continue
            if summary == '' and line.strip() and not line.startswith('#'):
              summary = line.strip()[:200]
            if '🔴' in line or '🟡' in line:
              issues_count += 1

          row = [
            datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),
            os.environ.get('GITHUB_REPOSITORY', ''),
            os.environ.get('PR_NUMBER', ''),
            os.environ.get('PR_TITLE', ''),
            os.environ.get('VERDICT', ''),
            summary,
            str(issues_count),
            f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/pull/{os.environ.get('PR_NUMBER','')}",
          ]

          # Sheets API 행 추가
          url = f'https://sheets.googleapis.com/v4/spreadsheets/{sheet_id}/values/A1:append?valueInputOption=USER_ENTERED'
          body = json.dumps({'values': [row]}).encode()
          req = urllib.request.Request(url, data=body, headers={
            'Authorization': f'Bearer {access_token}',
            'Content-Type': 'application/json',
          })
          urllib.request.urlopen(req)
          print(f'Logged to Google Sheets: {row[0]} | {row[4]}')
          PYEOF
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERDICT: ${{ steps.review.outputs.verdict }}
