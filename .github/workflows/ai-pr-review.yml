name: AI PR Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        run: |
          NUM="${{ github.event.pull_request.number }}"
          if [ -z "$NUM" ]; then
            NUM="${{ inputs.pr_number }}"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch PR diff
        run: gh pr diff "${{ steps.pr.outputs.number }}" > /tmp/pr_diff.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini review
        id: review
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          diff = open('/tmp/pr_diff.txt').read()[:12000]
          agents_md = open('AGENTS.md').read() if os.path.exists('AGENTS.md') else ''

          standards = agents_md if agents_md else '- Check correctness, security issues, and code quality'

          prompt = '\n'.join([
            'You are a code reviewer. Review the following PR diff.',
            '',
            'Review standards:',
            standards,
            '',
            'PR Diff:',
            diff,
            '',
            'Respond in this EXACT format (keep section headers exactly as shown):',
            '',
            '## Summary',
            '(2-3 sentences describing what changed)',
            '',
            '## Issues',
            '(list issues using: flag_red Critical | flag_yellow Suggestion | flag_green No issues)',
            '',
            '## Verdict',
            'APPROVE',
            '',
            'IMPORTANT: The last line of ## Verdict must be exactly APPROVE or REQUEST_CHANGES.',
            'Use REQUEST_CHANGES only if there is a Critical issue. Otherwise use APPROVE.',
          ])

          payload = {
            'contents': [{'parts': [{'text': prompt}]}],
            'generationConfig': {'maxOutputTokens': 1500, 'temperature': 0.2},
          }

          api_key = os.environ['GEMINI_API_KEY']
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key={api_key}'
          req = urllib.request.Request(
            url,
            data=json.dumps(payload).encode(),
            headers={'Content-Type': 'application/json'},
          )

          try:
            with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            print(f'Gemini API HTTP {e.code}: {e.reason}', file=sys.stderr)
            print(f'Response body: {body}', file=sys.stderr)
            # Try fallback model
            fallback = 'gemini-3.5-flash'
            print(f'Retrying with {fallback}...', file=sys.stderr)
            url2 = f'https://generativelanguage.googleapis.com/v1beta/models/{fallback}:generateContent?key={api_key}'
            req2 = urllib.request.Request(url2, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
            try:
              with urllib.request.urlopen(req2, timeout=60) as resp2:
                data = json.loads(resp2.read())
            except urllib.error.HTTPError as e2:
              body2 = e2.read().decode()
              print(f'Fallback also failed: {e2.code} {body2}', file=sys.stderr)
              sys.exit(1)
          except Exception as e:
            print(f'Gemini API error: {e}', file=sys.stderr)
            sys.exit(1)

          review = data['candidates'][0]['content']['parts'][0]['text']
          open('/tmp/review.txt', 'w').write(review)

          # Parse verdict
          verdict = 'REQUEST_CHANGES'
          for line in reversed(review.splitlines()):
            line = line.strip()
            if line == 'APPROVE':
              verdict = 'APPROVE'
              break
            if line == 'REQUEST_CHANGES':
              break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'verdict={verdict}\n')

          print(f'Verdict: {verdict}')
          PYEOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post review comment
        run: |
          VERDICT="${{ steps.review.outputs.verdict }}"
          PR_NUM="${{ steps.pr.outputs.number }}"

          if [ "$VERDICT" = "APPROVE" ]; then
            BADGE="![APPROVED](https://img.shields.io/badge/Gemini-APPROVED-brightgreen)"
          else
            BADGE="![REQUEST CHANGES](https://img.shields.io/badge/Gemini-REQUEST__CHANGES-red)"
          fi

          {
            echo "## Gemini Code Review — $BADGE"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "<!-- gemini-verdict: $VERDICT -->"
            echo ""
            echo "---"
            echo "*Reviewed by Gemini 3.6 Flash*"
          } > /tmp/comment.md

          gh pr comment "$PR_NUM" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Auto-merge if approved
        if: steps.review.outputs.verdict == 'APPROVE'
        run: |
          echo "Gemini approved — merging PR #${{ steps.pr.outputs.number }}"
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
