name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests
        run: npm test

  benchmark-regression:
    runs-on: ubuntu-latest
    # Only on PR — benchmark makes real HTTP requests, skip for push to main
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Benchmark regression gate
        # Runs live fetches and compares per-page against scripts/benchmark-baseline.json.
        # Fails if any page drops by >10%p in reduction or preservation vs baseline.
        run: node scripts/benchmark.mjs --check
