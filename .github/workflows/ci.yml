name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests
        run: npm test

  benchmark-regression:
    runs-on: ubuntu-latest
    # Only on PR — benchmark makes real HTTP requests, skip for push to main
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Benchmark regression gate
        run: |
          RESULT=$(node scripts/benchmark.mjs --json)
          echo "$RESULT" | jq .

          AVG_REDUCTION=$(echo "$RESULT" | jq '.avgReductionPct')
          AVG_PRESERVATION=$(echo "$RESULT" | jq '.avgPreservationPct')

          echo "Avg token reduction:   ${AVG_REDUCTION}%  (threshold: 90%)"
          echo "Avg preservation rate: ${AVG_PRESERVATION}%  (threshold: 70%)"

          if (( $(echo "$AVG_REDUCTION < 90" | bc -l) )); then
            echo "❌ Token reduction ${AVG_REDUCTION}% is below 90% threshold"
            exit 1
          fi

          if (( $(echo "$AVG_PRESERVATION < 70" | bc -l) )); then
            echo "❌ Preservation rate ${AVG_PRESERVATION}% is below 70% threshold"
            exit 1
          fi

          echo "✅ Benchmark passed"
