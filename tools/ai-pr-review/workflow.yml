name: AI PR Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        run: |
          NUM="${{ github.event.pull_request.number }}"
          if [ -z "$NUM" ]; then
            NUM="${{ inputs.pr_number }}"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch PR diff (source files only)
        run: |
          # 설정/문서 파일 제외 — Gemini가 소스 코드만 리뷰하도록
          gh pr diff "${{ steps.pr.outputs.number }}" \
            -- ':!*.yml' ':!*.yaml' ':!*.md' ':!*.lock' \
               ':!*.json' ':!*.toml' ':!*.txt' ':!*.env*' \
            > /tmp/pr_diff.txt || true

          # 소스 파일이 없으면 전체 diff로 폴백
          if [ ! -s /tmp/pr_diff.txt ]; then
            gh pr diff "${{ steps.pr.outputs.number }}" > /tmp/pr_diff.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Gemini review
        id: review
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          diff = open('/tmp/pr_diff.txt').read()[:20000]
          agents_md = open('AGENTS.md').read() if os.path.exists('AGENTS.md') else ''

          standards = agents_md if agents_md else '- 정확성, 보안 취약점, 코드 품질 확인'

          prompt = '\n'.join([
            '당신은 시니어 소프트웨어 엔지니어입니다. 아래 PR diff를 한국어로 코드 리뷰해 주세요.',
            '',
            '리뷰 기준:',
            standards,
            '',
            'PR Diff:',
            diff,
            '',
            '아래 형식을 정확히 지켜서 한국어로 답변하세요:',
            '',
            '## 요약',
            '(변경 사항을 2-3문장으로 설명)',
            '',
            '## 이슈',
            '(🔴 치명적 | 🟡 제안 | ✅ 이슈 없음 형식으로 작성)',
            '',
            '## 판정',
            'APPROVE',
            '',
            '중요: ## 판정 섹션의 마지막 줄은 반드시 APPROVE 또는 REQUEST_CHANGES 중 하나여야 합니다.',
            '🔴 치명적 이슈가 있으면 REQUEST_CHANGES, 없으면 APPROVE를 사용하세요.',
          ])

          payload = {
            'contents': [{'parts': [{'text': prompt}]}],
            'generationConfig': {'maxOutputTokens': 1500, 'temperature': 0.2},
          }

          api_key = os.environ['GEMINI_API_KEY']
          models = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-2.5-flash']

          data = None
          for model in models:
            url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}'
            req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
            )
            try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                data = json.loads(resp.read())
                print(f'Using model: {model}')
                break
            except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f'{model} failed ({e.code}): {body[:200]}', file=sys.stderr)
            except Exception as e:
              print(f'{model} error: {e}', file=sys.stderr)

          if data is None:
            print('All models failed.', file=sys.stderr)
            sys.exit(1)

          review = data['candidates'][0]['content']['parts'][0]['text']
          open('/tmp/review.txt', 'w').write(review)

          verdict = 'REQUEST_CHANGES'
          for line in reversed(review.splitlines()):
            line = line.strip()
            if line == 'APPROVE':
              verdict = 'APPROVE'
              break
            if line == 'REQUEST_CHANGES':
              break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'verdict={verdict}\n')

          print(f'Verdict: {verdict}')
          PYEOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post review comment
        run: |
          VERDICT="${{ steps.review.outputs.verdict }}"
          PR_NUM="${{ steps.pr.outputs.number }}"

          if [ "$VERDICT" = "APPROVE" ]; then
            BADGE="![승인됨](https://img.shields.io/badge/Gemini-승인됨-brightgreen)"
          else
            BADGE="![수정 요청](https://img.shields.io/badge/Gemini-수정_요청-red)"
          fi

          {
            echo "## 🤖 Gemini 코드 리뷰 — $BADGE"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "<!-- gemini-verdict: $VERDICT -->"
            echo ""
            echo "---"
            echo "*Gemini AI 자동 리뷰*"
          } > /tmp/comment.md

          gh pr comment "$PR_NUM" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Auto-merge if approved
        if: steps.review.outputs.verdict == 'APPROVE'
        run: |
          echo "Gemini 승인 — PR #${{ steps.pr.outputs.number }} 자동 merge"
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
